name: Security Task Checks

on:
  push:
    branches:
      - task3-web-security
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate Postman collection JSON
        run: node -e "JSON.parse(require('fs').readFileSync('postman/Web_Security_Fundamentals.postman_collection.json','utf8')); console.log('Postman collection JSON is valid')"

      - name: Confirm env file is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '.env must not be tracked'
            exit 1
          fi
          echo '.env is not tracked'
